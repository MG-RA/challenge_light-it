name: Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The target is a shared remote env: don't run two suites against it for the same ref.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pull requests from forks receive no secrets and could not reach the target.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium

      # Secrets are scoped to this step only, not to install scripts run by `npm ci`.
      # Non-secret settings read a repository variable first, then a secret of the same name;
      # variables keep URLs readable in logs, while secret values are masked as ***.
      # A missing value fails fast in src/config/env.ts.
      - run: npx playwright test
        env:
          BASE_URL: ${{ vars.BASE_URL || secrets.BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
          DB_PORT: ${{ vars.DB_PORT || secrets.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
          TEST_TIMEZONE: ${{ vars.TEST_TIMEZONE }}
          APP_USER_EMAIL: ${{ secrets.APP_USER_EMAIL }}
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
